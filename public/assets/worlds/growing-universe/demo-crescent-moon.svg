<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="100%" height="100%">
  <defs>
    <filter id="moon-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000005" flood-opacity="0.35"/>
    </filter>
  </defs>

  <g filter="url(#moon-shadow)">
    <!-- Crescent Cutout Piece -->
    <path d="M 50 12 Q 22 24 22 50 Q 22 76 50 88 Q 32 70 32 50 Q 32 30 50 12 Z" fill="#FEF08A" stroke="#FFFFFF" stroke-width="1.5" stroke-linejoin="round"/>
    <!-- Subtle Crater Dots on Crescent -->
    <circle cx="30" cy="42" r="2.5" fill="#FACC15" opacity="0.8"/>
    <circle cx="34" cy="58" r="3" fill="#FACC15" opacity="0.8"/>
  </g>
</svg>
