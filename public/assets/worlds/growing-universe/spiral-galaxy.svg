<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="4" stdDeviation="2" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <!-- Swirling stardust galaxy arms -->
    <ellipse cx="50" cy="50" rx="42" ry="18" fill="none" stroke="#EC4899" stroke-width="4" stroke-dasharray="6,4" transform="rotate(-25 50 50)"/>
    <ellipse cx="50" cy="50" rx="32" ry="12" fill="none" stroke="#8B5CF6" stroke-width="5" stroke-dasharray="8,3" transform="rotate(35 50 50)"/>
    <ellipse cx="50" cy="50" rx="20" ry="8" fill="none" stroke="#38BDF8" stroke-width="4" transform="rotate(-15 50 50)"/>
    <!-- Core -->
    <circle cx="50" cy="50" r="10" fill="#FEF08A" stroke="#F59E0B" stroke-width="2"/>
    <circle cx="50" cy="50" r="5" fill="#FFFFFF"/>
    <!-- Star glints -->
    <polygon points="50,22 52,28 58,30 52,32 50,38 48,32 42,30 48,28" fill="#FDF4FF"/>
    <polygon points="76,62 77,66 81,67 77,68 76,72 75,68 71,67 75,66" fill="#FDF4FF"/>
  </g>
</svg>
