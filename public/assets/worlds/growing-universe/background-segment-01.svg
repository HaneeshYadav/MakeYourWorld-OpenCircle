<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="100%" height="100%">
  <defs>
    <filter id="universe-shadow" x="-10%" y="-10%" width="130%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000005" flood-opacity="0.5"/>
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000005" flood-opacity="0.3"/>
    </filter>
    <radialGradient id="space-glow-1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#090a16" stop-opacity="1"/>
    </radialGradient>
  </defs>

  <!-- Deep Space Cardstock Backdrop -->
  <rect width="1600" height="900" fill="#090a16"/>
  <rect width="1600" height="900" fill="url(#space-glow-1)"/>

  <!-- Distant Stardust & Paper Starfield -->
  <g opacity="0.6">
    <circle cx="120" cy="180" r="1.5" fill="#FFFFFF"/>
    <circle cx="280" cy="90" r="2" fill="#FEF08A"/>
    <circle cx="450" cy="240" r="1.5" fill="#FFFFFF"/>
    <circle cx="620" cy="120" r="2.5" fill="#E0E7FF"/>
    <circle cx="790" cy="280" r="1.5" fill="#FFFFFF"/>
    <circle cx="950" cy="80" r="2" fill="#FEF08A"/>
    <circle cx="1120" cy="210" r="1.5" fill="#FFFFFF"/>
    <circle cx="1340" cy="140" r="2" fill="#E0E7FF"/>
    <circle cx="1480" cy="260" r="1.5" fill="#FFFFFF"/>
    <circle cx="340" cy="380" r="1.5" fill="#FFFFFF"/>
    <circle cx="820" cy="420" r="2" fill="#FEF08A"/>
    <circle cx="1280" cy="390" r="1.5" fill="#FFFFFF"/>
  </g>

  <!-- Subtle Dashed Orbital Ribbon -->
  <path d="M -100 700 Q 800 200 1700 650" fill="none" stroke="#4338CA" stroke-width="1.5" stroke-dasharray="8,8" opacity="0.4"/>

  <!-- Home Planet Horizon (Giant Curved Paper Cutout) -->
  <g filter="url(#universe-shadow)">
    <!-- Atmosphere Glow Layer -->
    <path d="M -200 950 Q 800 580 1800 950 Z" fill="#312E81" opacity="0.4"/>
    <!-- Outer Planet Crust Layer -->
    <path d="M -200 980 Q 800 620 1800 980 Z" fill="#1E1B4B" stroke="#4F46E5" stroke-width="1.5"/>
    <!-- Deep Planetary Surface Layer -->
    <path d="M -200 1020 Q 800 680 1800 1020 Z" fill="#0F172A"/>
  </g>

  <!-- Distant Small Paper Moon Disc -->
  <g filter="url(#universe-shadow)">
    <circle cx="1320" cy="220" r="48" fill="#E2E8F0" stroke="#FFFFFF" stroke-width="1.5"/>
    <circle cx="1335" cy="210" r="44" fill="#090a16" opacity="0.85"/>
  </g>
</svg>
