<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 90" width="100%" height="100%">
  <defs>
    <filter id="asteroid-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000005" flood-opacity="0.35"/>
    </filter>
  </defs>

  <g filter="url(#asteroid-shadow)">
    <!-- Angular Asteroid Silhouette -->
    <polygon points="20,50 32,25 65,18 92,35 100,62 78,82 45,85 18,72" fill="#475569" stroke="#FFFFFF" stroke-width="1.5" stroke-linejoin="round"/>
    
    <!-- Paper Shading Facets -->
    <polygon points="32,25 65,18 55,48 20,50" fill="#64748B" opacity="0.7"/>
    <polygon points="65,18 92,35 75,55 55,48" fill="#94A3B8" opacity="0.6"/>
    <polygon points="20,50 55,48 45,85 18,72" fill="#334155" opacity="0.8"/>

    <!-- Small Crater -->
    <circle cx="78" cy="65" r="4.5" fill="#1E293B"/>
    <circle cx="79" cy="64" r="3.5" fill="#334155"/>
  </g>
</svg>
