<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <filter id="celestial-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000005" flood-opacity="0.35"/>
    </filter>
  </defs>

  <g filter="url(#celestial-shadow)">
    <!-- Planet Base Disc (Warm Paper Earthtone/Teal) -->
    <circle cx="50" cy="50" r="38" fill="#0284C7" stroke="#FFFFFF" stroke-width="1.5"/>
    
    <!-- Paper Continents / Atmosphere Bands -->
    <path d="M 22 40 Q 40 32 60 42 Q 78 35 86 52 Q 68 58 48 50 Q 28 62 22 40 Z" fill="#10B981" opacity="0.9"/>
    <path d="M 32 65 Q 52 58 72 68 Q 65 82 45 84 Q 28 78 32 65 Z" fill="#059669" opacity="0.85"/>
    
    <!-- Highlight Reflection Crescent -->
    <path d="M 20 40 Q 30 20 55 16 Q 35 24 25 45 Z" fill="#BAE6FD" opacity="0.7"/>
  </g>
</svg>
