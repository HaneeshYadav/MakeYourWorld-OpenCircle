<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 70" width="100%" height="100%">
  <defs>
    <filter id="canoe-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#082f49" flood-opacity="0.25"/>
    </filter>
  </defs>

  <g filter="url(#canoe-shadow)">
    <!-- Main Hull (Carved Wood Paper) -->
    <path d="M 8 30 Q 60 55 112 30 Q 85 45 60 46 Q 35 45 8 30 Z" fill="#92400E" stroke="#451A03" stroke-width="1.5"/>
    <!-- Outer Plank Layer -->
    <path d="M 12 33 Q 60 52 108 33 Q 85 42 60 43 Q 35 42 12 33 Z" fill="#B45309"/>

    <!-- Outrigger Struts & Float Log -->
    <line x1="40" y1="40" x2="40" y2="58" stroke="#78350F" stroke-width="2.5"/>
    <line x1="80" y1="40" x2="80" y2="58" stroke="#78350F" stroke-width="2.5"/>
    <!-- Float Log -->
    <rect x="25" y="56" width="70" height="7" rx="3.5" fill="#D97706" stroke="#78350F" stroke-width="1"/>
  </g>
</svg>
