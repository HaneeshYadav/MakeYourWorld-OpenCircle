<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="100%" height="100%">
  <defs>
    <filter id="flower-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#082f49" flood-opacity="0.25"/>
    </filter>
  </defs>

  <g filter="url(#flower-shadow)">
    <!-- 5 Petals (Hibiscus Magenta Cardstock) -->
    <circle cx="40" cy="22" r="14" fill="#EC4899" stroke="#FFFFFF" stroke-width="1.2"/>
    <circle cx="56" cy="34" r="14" fill="#EC4899" stroke="#FFFFFF" stroke-width="1.2"/>
    <circle cx="50" cy="54" r="14" fill="#EC4899" stroke="#FFFFFF" stroke-width="1.2"/>
    <circle cx="30" cy="54" r="14" fill="#EC4899" stroke="#FFFFFF" stroke-width="1.2"/>
    <circle cx="24" cy="34" r="14" fill="#EC4899" stroke="#FFFFFF" stroke-width="1.2"/>

    <!-- Inner Coral Glow & Center Stamen -->
    <circle cx="40" cy="40" r="9" fill="#F43F5E"/>
    <path d="M 40 40 L 40 18" stroke="#FBBF24" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="40" cy="17" r="3.5" fill="#F59E0B"/>
  </g>
</svg>
