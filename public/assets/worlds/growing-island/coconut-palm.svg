<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 140" width="100%" height="100%">
  <defs>
    <filter id="palm-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#082f49" flood-opacity="0.25"/>
    </filter>
  </defs>

  <g filter="url(#palm-shadow)">
    <!-- Slender Curved Trunk -->
    <path d="M 50 135 Q 38 90 55 45 L 62 48 Q 46 90 58 135 Z" fill="#78350F" stroke="#451A03" stroke-width="1.2"/>

    <!-- Palm Fronds (Vibrant Layered Tropical Leaves) -->
    <!-- Frond Left -->
    <path d="M 58 45 Q 25 35 10 55 Q 30 65 58 45 Z" fill="#15803D" stroke="#FFFFFF" stroke-width="1.2"/>
    <!-- Frond Right -->
    <path d="M 58 45 Q 90 35 105 55 Q 85 65 58 45 Z" fill="#15803D" stroke="#FFFFFF" stroke-width="1.2"/>
    <!-- Frond Top Left -->
    <path d="M 58 45 Q 35 10 20 25 Q 45 40 58 45 Z" fill="#16A34A" stroke="#FFFFFF" stroke-width="1.2"/>
    <!-- Frond Top Right -->
    <path d="M 58 45 Q 80 10 95 25 Q 70 40 58 45 Z" fill="#16A34A" stroke="#FFFFFF" stroke-width="1.2"/>
    <!-- Frond Center Crest -->
    <path d="M 58 45 Q 58 5 50 15 Q 52 35 58 45 Z" fill="#22C55E" stroke="#FFFFFF" stroke-width="1.2"/>

    <!-- Coconuts Cluster -->
    <circle cx="53" cy="48" r="4.5" fill="#451A03"/>
    <circle cx="61" cy="48" r="4.5" fill="#451A03"/>
    <circle cx="57" cy="54" r="4" fill="#78350F"/>
  </g>
</svg>
