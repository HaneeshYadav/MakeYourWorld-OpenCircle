<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="4" stdDeviation="2" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <!-- Tower base -->
    <polygon points="36,92 64,92 60,34 40,34" fill="#F8FAFC" stroke="#0284C7" stroke-width="2"/>
    <!-- Red stripes -->
    <polygon points="38,80 62,80 61,66 39,66" fill="#EF4444"/>
    <polygon points="40,52 60,52 59,38 41,38" fill="#EF4444"/>
    <!-- Lantern room & gallery -->
    <rect x="34" y="30" width="32" height="4" rx="1" fill="#0369A1"/>
    <rect x="38" y="18" width="24" height="12" fill="#BAE6FD" stroke="#0284C7" stroke-width="2"/>
    <!-- Dome roof -->
    <path d="M38 18 C38 8 62 8 62 18 Z" fill="#DC2626" stroke="#991B1B" stroke-width="2"/>
    <!-- Beacon light beam -->
    <polygon points="50,22 88,10 92,30" fill="#FEF08A" opacity="0.6"/>
  </g>
</svg>
