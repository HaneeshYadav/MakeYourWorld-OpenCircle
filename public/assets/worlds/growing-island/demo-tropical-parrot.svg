<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 90 100" width="100%" height="100%">
  <defs>
    <filter id="parrot-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#082f49" flood-opacity="0.25"/>
    </filter>
  </defs>

  <g filter="url(#parrot-shadow)">
    <!-- Long Tail Feathers (Cyan & Yellow) -->
    <path d="M 38 60 L 25 95 L 34 94 L 44 65 Z" fill="#0284C7"/>
    <path d="M 42 60 L 35 98 L 42 96 L 48 65 Z" fill="#FACC15"/>

    <!-- Body & Head (Bright Crimson Scarlet Cardstock) -->
    <path d="M 35 30 Q 32 15 48 15 Q 65 15 65 35 Q 65 65 45 65 Q 32 65 35 30 Z" fill="#DC2626" stroke="#FFFFFF" stroke-width="1.5"/>

    <!-- Wing (Royal Blue & Emerald Tiers) -->
    <path d="M 46 32 Q 62 38 58 58 Q 45 60 42 42 Z" fill="#2563EB" stroke="#FFFFFF" stroke-width="1"/>
    <path d="M 46 38 Q 58 42 54 54 Q 45 55 43 44 Z" fill="#16A34A"/>

    <!-- Curved Beak & Face Patch -->
    <path d="M 58 20 Q 72 22 70 32 Q 62 30 58 26 Z" fill="#FEF08A" stroke="#78350F" stroke-width="1"/>
    <circle cx="52" cy="22" r="3.5" fill="#FFFFFF"/>
    <circle cx="53" cy="22" r="1.5" fill="#1E293B"/>
  </g>
</svg>
