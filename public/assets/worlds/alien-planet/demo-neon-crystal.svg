<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 70 90" width="100%" height="100%">
  <defs>
    <filter id="cryst-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#022c22" flood-opacity="0.25"/>
    </filter>
  </defs>

  <g filter="url(#cryst-shadow)">
    <!-- Neon Lime Prism Cluster -->
    <!-- Center Tall Spire -->
    <polygon points="35,12 48,45 22,45" fill="#A3E635" stroke="#FFFFFF" stroke-width="1.2"/>
    <polygon points="35,12 48,45 35,45" fill="#65A30D"/>
    <polygon points="22,45 48,45 42,78 28,78" fill="#4D7C0F" stroke="#FFFFFF" stroke-width="1"/>

    <!-- Left Smaller Shard -->
    <polygon points="20,28 30,55 10,55" fill="#2DD4BF" stroke="#FFFFFF" stroke-width="1"/>
    <polygon points="10,55 30,55 24,75 14,75" fill="#0D9488"/>

    <!-- Right Shard -->
    <polygon points="50,32 62,60 38,60" fill="#BEF264" stroke="#FFFFFF" stroke-width="1"/>
  </g>
</svg>
