<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="100%" height="100%">
  <defs>
    <filter id="alien-shadow" x="-10%" y="-10%" width="130%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#022c22" flood-opacity="0.3"/>
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#022c22" flood-opacity="0.15"/>
    </filter>
    <linearGradient id="alien-sky-2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#311042"/>
      <stop offset="50%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#A3E635"/>
    </linearGradient>
  </defs>

  <!-- Sky Layer (Continuous with Segment 01) -->
  <rect width="1600" height="900" fill="url(#alien-sky-2)"/>

  <!-- Floating Bioluminescent Spore Clouds (Midground Ambient) -->
  <g opacity="0.6">
    <circle cx="280" cy="240" r="14" fill="#A3E635" filter="url(#alien-shadow)"/>
    <circle cx="580" cy="180" r="18" fill="#2DD4BF"/>
    <circle cx="980" cy="220" r="12" fill="#A3E635"/>
    <circle cx="1320" cy="190" r="16" fill="#2DD4BF"/>
  </g>

  <!-- Giant Xenoflora Spore Canopy Stems & Caps -->
  <g filter="url(#alien-shadow)">
    <!-- Mushroom 1 (Left) -->
    <path d="M 80 480 Q 240 260 400 480 Z" fill="#047857" stroke="#34D399" stroke-width="2"/>
    <rect x="220" y="480" width="40" height="240" fill="#064E3B"/>
    <circle cx="160" cy="380" r="14" fill="#BEF264"/>
    <circle cx="320" cy="400" r="12" fill="#BEF264"/>

    <!-- Mushroom 2 (Right) -->
    <path d="M 1120 450 Q 1300 220 1480 450 Z" fill="#0F766E" stroke="#2DD4BF" stroke-width="2"/>
    <rect x="1280" y="450" width="40" height="260" fill="#042F2E"/>
    <circle cx="1220" cy="360" r="16" fill="#A3E635"/>
    <circle cx="1380" cy="380" r="14" fill="#A3E635"/>
  </g>

  <!-- Spore Forest Mossy Alien Soil Tier -->
  <g filter="url(#alien-shadow)">
    <path d="M 0 680 Q 450 620 950 660 T 1600 640 L 1600 900 L 0 900 Z" fill="#065F46"/>
    <path d="M 0 780 Q 520 730 1080 770 T 1600 750 L 1600 900 L 0 900 Z" fill="#022C22"/>
  </g>
</svg>
