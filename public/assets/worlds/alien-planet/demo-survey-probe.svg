<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="100%" height="100%">
  <defs>
    <filter id="probe-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#022c22" flood-opacity="0.25"/>
    </filter>
  </defs>

  <g filter="url(#probe-shadow)">
    <!-- Tripod Landing Struts -->
    <path d="M 25 48 L 12 70 M 55 48 L 68 70 M 40 48 L 40 72" stroke="#94A3B8" stroke-width="2.5" stroke-linecap="round"/>
    
    <!-- Spherical Survey Core (Titanium Slate & Sensor Lens) -->
    <circle cx="40" cy="36" r="18" fill="#334155" stroke="#FFFFFF" stroke-width="1.5"/>
    <circle cx="40" cy="36" r="10" fill="#0D9488"/>
    <circle cx="40" cy="36" r="4" fill="#2DD4BF"/>

    <!-- Antenna & Dish -->
    <line x1="40" y1="18" x2="40" y2="8" stroke="#94A3B8" stroke-width="2"/>
    <circle cx="40" cy="6" r="3" fill="#FACC15"/>
  </g>
</svg>
