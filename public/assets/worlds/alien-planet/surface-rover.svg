<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="4" stdDeviation="2" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <!-- Main rover body -->
    <rect x="25" y="44" width="50" height="24" rx="4" fill="#0D9488" stroke="#115E59" stroke-width="2"/>
    <!-- Sensor mast -->
    <line x1="62" y1="44" x2="62" y2="22" stroke="#475569" stroke-width="3"/>
    <circle cx="62" cy="20" r="5" fill="#84CC16" stroke="#4D7C0F" stroke-width="1.5"/>
    <!-- Solar panels -->
    <rect x="20" y="38" width="22" height="6" fill="#38BDF8" stroke="#0284C7" stroke-width="1"/>
    <!-- All-terrain wheels with suspensions -->
    <circle cx="28" cy="74" r="10" fill="#1E293B" stroke="#0F172A" stroke-width="2.5"/>
    <circle cx="28" cy="74" r="4" fill="#84CC16"/>
    <circle cx="50" cy="74" r="10" fill="#1E293B" stroke="#0F172A" stroke-width="2.5"/>
    <circle cx="50" cy="74" r="4" fill="#84CC16"/>
    <circle cx="72" cy="74" r="10" fill="#1E293B" stroke="#0F172A" stroke-width="2.5"/>
    <circle cx="72" cy="74" r="4" fill="#84CC16"/>
  </g>
</svg>
