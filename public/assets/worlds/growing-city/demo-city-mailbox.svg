<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 90" width="100%" height="100%">
  <defs>
    <filter id="box-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.25"/>
    </filter>
  </defs>

  <g filter="url(#box-shadow)">
    <!-- Post -->
    <rect x="26" y="55" width="8" height="32" fill="#334155"/>
    
    <!-- Mailbox Body (Classic Cobalt Blue Cardstock) -->
    <path d="M 12 55 L 12 25 Q 12 10 30 10 Q 48 10 48 25 L 48 55 Z" fill="#1D4ED8" stroke="#FFFFFF" stroke-width="1.5"/>
    
    <!-- Mail Drop Door Slot -->
    <rect x="18" y="24" width="24" height="6" rx="2" fill="#1E293B"/>
    <!-- Pull Handle -->
    <line x1="24" y1="36" x2="36" y2="36" stroke="#93C5FD" stroke-width="2"/>
  </g>
</svg>
