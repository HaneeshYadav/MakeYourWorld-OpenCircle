<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 80" width="100%" height="100%">
  <defs>
    <filter id="bench-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.25"/>
    </filter>
  </defs>

  <g filter="url(#bench-shadow)">
    <!-- Cast Iron Legs -->
    <path d="M 20 50 L 15 75 M 30 50 L 25 75 M 70 50 L 65 75 M 80 50 L 75 75" stroke="#1E293B" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Wooden Slats (Warm Teak Paper) -->
    <!-- Backrest -->
    <rect x="10" y="25" width="80" height="7" rx="2" fill="#B45309" stroke="#78350F" stroke-width="1"/>
    <rect x="10" y="35" width="80" height="7" rx="2" fill="#B45309" stroke="#78350F" stroke-width="1"/>
    
    <!-- Seat -->
    <rect x="8" y="48" width="84" height="8" rx="2" fill="#D97706" stroke="#78350F" stroke-width="1"/>
  </g>
</svg>
