<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 50 140" width="100%" height="100%">
  <defs>
    <filter id="lamp-shadow" x="-30%" y="-20%" width="160%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.25"/>
    </filter>
  </defs>

  <g filter="url(#lamp-shadow)">
    <!-- Base -->
    <path d="M 12 135 L 38 135 L 34 125 L 16 125 Z" fill="#1E293B" stroke="#0F172A" stroke-width="1.2"/>
    <!-- Pole -->
    <rect x="23" y="35" width="4" height="90" fill="#334155"/>
    <circle cx="25" cy="80" r="4" fill="#1E293B"/>

    <!-- Lantern Head & Glowing Amber Glass -->
