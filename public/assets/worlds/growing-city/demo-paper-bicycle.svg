<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 80" width="100%" height="100%">
  <defs>
    <filter id="bike-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.25"/>
    </filter>
  </defs>

  <g filter="url(#bike-shadow)">
    <!-- Wheels -->
    <circle cx="28" cy="52" r="22" fill="none" stroke="#1E293B" stroke-width="3"/>
    <circle cx="28" cy="52" r="2" fill="#94A3B8"/>
    <circle cx="82" cy="52" r="22" fill="none" stroke="#1E293B" stroke-width="3"/>
    <circle cx="82" cy="52" r="2" fill="#94A3B8"/>

    <!-- Diamond Frame (Bright Teal/Cyan Paper) -->
    <path d="M 28 52 L 50 52 L 72 32 L 44 32 Z" fill="none" stroke="#0284C7" stroke-width="3.5" stroke-linejoin="round"/>
    <line x1="50" y1="52" x2="44" y2="24" stroke="#0284C7" stroke-width="3.5"/>
    <line x1="82" y1="52" x2="72" y2="22" stroke="#0284C7" stroke-width="3.5"/>

    <!-- Saddle & Handlebars -->
    <path d="M 38 24 L 50 24" stroke="#78350F" stroke-width="4" stroke-linecap="round"/>
    <path d="M 68 20 Q 74 15 80 22" fill="none" stroke="#1E293B" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
