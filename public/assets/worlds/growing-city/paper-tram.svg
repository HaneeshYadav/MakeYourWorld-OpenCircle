<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="4" stdDeviation="2" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <!-- Tram body -->
    <rect x="15" y="32" width="70" height="42" rx="6" fill="#DC2626" stroke="#991B1B" stroke-width="2.5"/>
    <!-- Cream roof -->
    <path d="M12 34 C12 28 88 28 88 34 Z" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
    <!-- Pantograph / electric pole -->
    <path d="M50 28 L42 16 L58 16 L50 28" fill="none" stroke="#475569" stroke-width="2.5"/>
    <line x1="36" y1="14" x2="64" y2="14" stroke="#334155" stroke-width="3"/>
    <!-- Windows -->
    <rect x="22" y="38" width="12" height="14" rx="2" fill="#E2E8F0" stroke="#64748B" stroke-width="1.5"/>
    <rect x="38" y="38" width="12" height="14" rx="2" fill="#E2E8F0" stroke="#64748B" stroke-width="1.5"/>
    <rect x="54" y="38" width="12" height="14" rx="2" fill="#E2E8F0" stroke="#64748B" stroke-width="1.5"/>
    <rect x="70" y="38" width="10" height="24" rx="2" fill="#E2E8F0" stroke="#64748B" stroke-width="1.5"/>
    <!-- Wheels -->
    <circle cx="30" cy="76" r="6" fill="#334155" stroke="#1E293B" stroke-width="2"/>
    <circle cx="70" cy="76" r="6" fill="#334155" stroke="#1E293B" stroke-width="2"/>
  </g>
</svg>
