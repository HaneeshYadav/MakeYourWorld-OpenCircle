<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="100%" height="100%">
  <defs>
    <filter id="city-shadow" x="-10%" y="-10%" width="130%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.22"/>
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <linearGradient id="city-sky-2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#BAE6FD"/>
      <stop offset="60%" stop-color="#E0F2FE"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>
  </defs>

  <!-- Sky Layer -->
  <rect width="1600" height="900" fill="url(#city-sky-2)"/>

  <!-- Distant Architectural Skyline -->
  <g filter="url(#city-shadow)" opacity="0.4">
    <polygon points="120,450 200,280 280,450" fill="#475569"/>
    <rect x="420" y="240" width="220" height="380" fill="#334155"/>
    <rect x="940" y="210" width="240" height="410" fill="#475569"/>
    <polygon points="1060,140 1050,210 1070,210" fill="#475569"/>
    <rect x="1320" y="280" width="180" height="340" fill="#64748B"/>
  </g>

  <!-- Town Square Civic Hall & Clock Tower (Centerpiece) -->
  <g filter="url(#city-shadow)">
    <!-- Main Civic Center Hall -->
    <rect x="480" y="320" width="640" height="340" fill="#F8FAFC" stroke="#94A3B8" stroke-width="2"/>
    <!-- Colonnade Pillars -->
    <rect x="520" y="440" width="24" height="220" fill="#E2E8F0"/>
    <rect x="620" y="440" width="24" height="220" fill="#E2E8F0"/>
    <rect x="720" y="440" width="24" height="220" fill="#E2E8F0"/>
    <rect x="850" y="440" width="24" height="220" fill="#E2E8F0"/>
    <rect x="950" y="440" width="24" height="220" fill="#E2E8F0"/>
    <rect x="1050" y="440" width="24" height="220" fill="#E2E8F0"/>
    <!-- Triangular Pediment -->
    <polygon points="460,320 800,190 1140,320" fill="#E2E8F0" stroke="#94A3B8" stroke-width="2"/>
    <!-- Clock Tower -->
    <rect x="740" y="90" width="120" height="120" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2"/>
    <circle cx="800" cy="150" r="35" fill="#FEF08A" stroke="#0F172A" stroke-width="2"/>
    <line x1="800" y1="150" x2="800" y2="128" stroke="#0F172A" stroke-width="2"/>
    <line x1="800" y1="150" x2="815" y2="150" stroke="#0F172A" stroke-width="2"/>
  </g>

  <!-- Stone Plaza Pavement Floor (Cobblestone Tiles) -->
  <g filter="url(#city-shadow)">
    <rect x="0" y="660" width="1600" height="240" fill="#E2E8F0"/>
    <!-- Central Circular Plaza Motif -->
    <ellipse cx="800" cy="780" rx="360" ry="90" fill="#CBD5E1" stroke="#94A3B8" stroke-width="2"/>
    <ellipse cx="800" cy="780" rx="200" ry="50" fill="#94A3B8" stroke="#64748B" stroke-width="1.5"/>
  </g>
</svg>
