<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="100%" height="100%">
  <defs>
    <filter id="city-shadow" x="-10%" y="-10%" width="130%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.22"/>
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <linearGradient id="city-sky-1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#CBD5E1"/>
      <stop offset="60%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>
  </defs>

  <!-- Sky Layer -->
  <rect width="1600" height="900" fill="url(#city-sky-1)"/>

  <!-- Distant High-Rise Silhouettes -->
  <g filter="url(#city-shadow)" opacity="0.45">
    <rect x="180" y="240" width="140" height="400" fill="#64748B"/>
    <rect x="360" y="180" width="180" height="460" fill="#475569"/>
    <polygon points="450,110 440,180 460,180" fill="#475569"/>
    <rect x="740" y="220" width="160" height="420" fill="#64748B"/>
    <rect x="1080" y="160" width="200" height="480" fill="#475569"/>
    <rect x="1340" y="260" width="150" height="380" fill="#64748B"/>
  </g>

  <!-- Midground Brownstone Facades (Terracotta & Brick Paper Layers) -->
  <g filter="url(#city-shadow)">
    <!-- Building 1 (Left) -->
    <rect x="40" y="340" width="340" height="360" fill="#991B1B" stroke="#7F1D1D" stroke-width="2"/>
    <rect x="80" y="380" width="50" height="70" rx="3" fill="#FEF08A" stroke="#7F1D1D" stroke-width="1.5"/>
    <rect x="180" y="380" width="50" height="70" rx="3" fill="#FEF08A" stroke="#7F1D1D" stroke-width="1.5"/>
    <rect x="280" y="380" width="50" height="70" rx="3" fill="#FEF08A" stroke="#7F1D1D" stroke-width="1.5"/>
    <rect x="80" y="490" width="50" height="70" rx="3" fill="#FEF08A" stroke="#7F1D1D" stroke-width="1.5"/>
    <rect x="180" y="490" width="50" height="70" rx="3" fill="#FEF08A" stroke="#7F1D1D" stroke-width="1.5"/>
    <rect x="280" y="490" width="50" height="70" rx="3" fill="#FEF08A" stroke="#7F1D1D" stroke-width="1.5"/>

    <!-- Building 2 (Center-Right) -->
    <rect x="520" y="300" width="460" height="400" fill="#78350F" stroke="#451A03" stroke-width="2"/>
    <rect x="580" y="350" width="60" height="80" rx="3" fill="#FEF08A" stroke="#451A03" stroke-width="1.5"/>
    <rect x="720" y="350" width="60" height="80" rx="3" fill="#FEF08A" stroke="#451A03" stroke-width="1.5"/>
    <rect x="860" y="350" width="60" height="80" rx="3" fill="#FEF08A" stroke="#451A03" stroke-width="1.5"/>

    <!-- Building 3 (Right) -->
    <rect x="1120" y="360" width="420" height="340" fill="#334155" stroke="#1E293B" stroke-width="2"/>
    <rect x="1180" y="410" width="55" height="75" rx="3" fill="#FEF08A" stroke="#1E293B" stroke-width="1.5"/>
    <rect x="1300" y="410" width="55" height="75" rx="3" fill="#FEF08A" stroke="#1E293B" stroke-width="1.5"/>
    <rect x="1420" y="410" width="55" height="75" rx="3" fill="#FEF08A" stroke="#1E293B" stroke-width="1.5"/>
  </g>

  <!-- Sidewalk Tier (Light Warm Concrete) -->
  <g filter="url(#city-shadow)">
    <rect x="0" y="690" width="1600" height="70" fill="#CBD5E1" stroke="#94A3B8" stroke-width="1.5"/>
    <line x1="0" y1="725" x2="1600" y2="725" stroke="#94A3B8" stroke-width="1" stroke-dasharray="40,2"/>
  </g>

  <!-- Asphalt Street Layer (Dark Slate Paper) -->
  <g filter="url(#city-shadow)">
    <rect x="0" y="760" width="1600" height="140" fill="#1E293B"/>
    <!-- Dashed Center Line -->
    <line x1="0" y1="830" x2="1600" y2="830" stroke="#FDE047" stroke-width="4" stroke-dasharray="60,40"/>
  </g>
</svg>
