<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="100%" height="100%">
  <defs>
    <filter id="city-shadow" x="-10%" y="-10%" width="130%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.22"/>
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <linearGradient id="city-sky-3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#94A3B8"/>
      <stop offset="60%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
  </defs>

  <!-- Sky Layer -->
  <rect width="1600" height="900" fill="url(#city-sky-3)"/>

  <!-- High-Density Skyscraper Silhouettes -->
  <g filter="url(#city-shadow)">
    <rect x="80" y="160" width="220" height="520" fill="#1E293B"/>
    <rect x="340" y="80" width="260" height="600" fill="#0F172A"/>
    <polygon points="470,20 460,80 480,80" fill="#0F172A"/>
    <rect x="640" y="140" width="200" height="540" fill="#1E293B"/>
    <rect x="880" y="100" width="280" height="580" fill="#0F172A"/>
    <rect x="1200" y="180" width="320" height="500" fill="#1E293B"/>
  </g>

  <!-- Elevated Railway / Transit Viaduct Canopy -->
  <g filter="url(#city-shadow)">
    <rect x="0" y="580" width="1600" height="40" fill="#475569" stroke="#334155" stroke-width="2"/>
    <!-- Viaduct Concrete Pillars -->
    <rect x="180" y="620" width="50" height="120" fill="#64748B"/>
    <rect x="580" y="620" width="50" height="120" fill="#64748B"/>
    <rect x="980" y="620" width="50" height="120" fill="#64748B"/>
    <rect x="1380" y="620" width="50" height="120" fill="#64748B"/>
  </g>

  <!-- Ground Transit Platform & Street Floor -->
  <g filter="url(#city-shadow)">
    <rect x="0" y="740" width="1600" height="160" fill="#334155"/>
    <!-- Platform Yellow Safety Border -->
    <rect x="0" y="740" width="1600" height="14" fill="#FACC15"/>
    <line x1="0" y1="820" x2="1600" y2="820" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="20,20"/>
  </g>
</svg>
