<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 140" width="100%" height="100%">
  <defs>
    <filter id="tree-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.25"/>
    </filter>
  </defs>

  <g filter="url(#tree-shadow)">
    <!-- Planter Box (Concrete Planter) -->
    <rect x="35" y="120" width="40" height="18" rx="2" fill="#94A3B8" stroke="#64748B" stroke-width="1.2"/>

    <!-- Trunk -->
    <path d="M 52 75 L 50 120 L 60 120 L 58 75 Z" fill="#78350F"/>
    
    <!-- Spherical Paper Foliage Tiers -->
    <circle cx="55" cy="50" r="38" fill="#15803D" stroke="#FFFFFF" stroke-width="1.5"/>
    <circle cx="48" cy="45" r="28" fill="#16A34A" opacity="0.85"/>
    <circle cx="62" cy="40" r="22" fill="#22C55E" opacity="0.75"/>
  </g>
</svg>
