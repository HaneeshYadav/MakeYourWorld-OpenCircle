<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 90 80" width="100%" height="100%">
  <defs>
    <filter id="pumpkin-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#451a03" flood-opacity="0.25"/>
    </filter>
  </defs>

  <g filter="url(#pumpkin-shadow)">
    <!-- Pumpkin Rib Lobes (Orange Cardstock Tiers) -->
    <!-- Back Lobe -->
    <ellipse cx="45" cy="50" rx="35" ry="24" fill="#C2410C"/>
    <!-- Outer Side Lobes -->
    <ellipse cx="26" cy="52" rx="18" ry="22" fill="#EA580C" stroke="#9A3412" stroke-width="1.2"/>
    <ellipse cx="64" cy="52" rx="18" ry="22" fill="#EA580C" stroke="#9A3412" stroke-width="1.2"/>
    <!-- Center Lobes -->
    <ellipse cx="36" cy="53" rx="16" ry="24" fill="#F97316" stroke="#C2410C" stroke-width="1.2"/>
    <ellipse cx="54" cy="53" rx="16" ry="24" fill="#F97316" stroke="#C2410C" stroke-width="1.2"/>
    <!-- Centerpiece Lobe -->
    <ellipse cx="45" cy="54" rx="14" ry="24" fill="#FB923C" stroke="#EA580C" stroke-width="1.2"/>

    <!-- Green Twisted Stem -->
    <path d="M 45 32 Q 40 18 52 14 Q 50 24 45 32 Z" fill="#15803D" stroke="#14532D" stroke-width="1.2"/>
    <circle cx="50" cy="18" r="2.5" fill="#22C55E"/>
  </g>
</svg>
