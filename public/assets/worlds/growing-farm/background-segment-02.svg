<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="100%" height="100%">
  <defs>
    <filter id="farm-shadow" x="-10%" y="-10%" width="130%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#451a03" flood-opacity="0.22"/>
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#451a03" flood-opacity="0.12"/>
    </filter>
    <linearGradient id="farm-sky-2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#93C5FD"/>
      <stop offset="60%" stop-color="#FEF08A"/>
      <stop offset="100%" stop-color="#FEF9C3"/>
    </linearGradient>
  </defs>

  <!-- Sky Layer (Continuous with Segment 01) -->
  <rect width="1600" height="900" fill="url(#farm-sky-2)"/>

  <!-- Distant Rolling Pasture Hills (Continuous Ridge Line) -->
  <g filter="url(#farm-shadow)">
    <path d="M 0 380 Q 420 320 860 360 T 1600 330 L 1600 600 L 0 600 Z" fill="#65A30D" opacity="0.8"/>
  </g>

  <!-- Vast Golden Wheat Field Terraces (Midground Core) -->
  <g filter="url(#farm-shadow)">
    <!-- Back Wheat Tier -->
    <path d="M 0 460 Q 480 410 980 450 T 1600 420 L 1600 700 L 0 700 Z" fill="#CA8A04"/>
    <!-- Middle Wheat Wave -->
    <path d="M 0 550 Q 420 500 880 540 T 1600 510 L 1600 800 L 0 800 Z" fill="#EAB308"/>
    <!-- Foreground Wheat Terrace -->
    <path d="M 0 650 Q 520 590 1050 630 T 1600 600 L 1600 900 L 0 900 Z" fill="#FACC15"/>
  </g>

  <!-- Earthy Farm Track / Edge Tier -->
  <g filter="url(#farm-shadow)">
    <path d="M 0 780 Q 450 730 920 760 T 1600 740 L 1600 900 L 0 900 Z" fill="#78350F"/>
  </g>
</svg>
