<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="4" stdDeviation="2" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <!-- Tower body -->
    <polygon points="38,92 62,92 56,38 44,38" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2"/>
    <!-- Mill roof cap -->
    <polygon points="50,22 40,38 60,38" fill="#991B1B" stroke="#7F1D1D" stroke-width="2"/>
    <!-- Rotor hub -->
    <circle cx="50" cy="38" r="4" fill="#B45309"/>
    <!-- 4 Sails / Blades -->
    <g stroke="#78350F" stroke-width="2" fill="#FEF3C7">
      <polygon points="50,38 46,10 54,10"/>
      <polygon points="50,38 78,34 78,42"/>
      <polygon points="50,38 54,66 46,66"/>
      <polygon points="50,38 22,42 22,34"/>
    </g>
    <!-- Door -->
    <path d="M46 92 L46 80 C46 76 54 76 54 80 L54 92 Z" fill="#78350F"/>
  </g>
</svg>
