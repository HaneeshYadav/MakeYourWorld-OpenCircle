<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 70 100" width="100%" height="100%">
  <defs>
    <filter id="wheat-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#451a03" flood-opacity="0.25"/>
    </filter>
  </defs>

  <g filter="url(#wheat-shadow)">
    <!-- Main Stems Bundle -->
    <path d="M 35 95 L 35 50 M 35 95 L 20 55 M 35 95 L 50 55" stroke="#CA8A04" stroke-width="3" stroke-linecap="round"/>

    <!-- Golden Wheat Heads / Grains -->
    <!-- Left Sheaf -->
    <ellipse cx="18" cy="45" rx="8" ry="14" fill="#EAB308" stroke="#CA8A04" stroke-width="1.2"/>
    <ellipse cx="16" cy="30" rx="7" ry="12" fill="#FACC15" stroke="#CA8A04" stroke-width="1.2"/>
    <!-- Center Sheaf -->
    <ellipse cx="35" cy="40" rx="9" ry="16" fill="#EAB308" stroke="#CA8A04" stroke-width="1.2"/>
    <ellipse cx="35" cy="22" rx="8" ry="14" fill="#FDE047" stroke="#CA8A04" stroke-width="1.2"/>
    <!-- Right Sheaf -->
    <ellipse cx="52" cy="45" rx="8" ry="14" fill="#EAB308" stroke="#CA8A04" stroke-width="1.2"/>
    <ellipse cx="54" cy="30" rx="7" ry="12" fill="#FACC15" stroke="#CA8A04" stroke-width="1.2"/>

    <!-- Red Tie Ribbon -->
    <rect x="25" y="70" width="20" height="7" rx="2" fill="#DC2626" stroke="#991B1B" stroke-width="1"/>
  </g>
</svg>
