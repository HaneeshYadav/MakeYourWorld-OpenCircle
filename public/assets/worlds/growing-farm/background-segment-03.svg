<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="100%" height="100%">
  <defs>
    <filter id="farm-shadow" x="-10%" y="-10%" width="130%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#451a03" flood-opacity="0.22"/>
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#451a03" flood-opacity="0.12"/>
    </filter>
    <linearGradient id="farm-sky-3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7DD3FC"/>
      <stop offset="60%" stop-color="#FEF08A"/>
      <stop offset="100%" stop-color="#FFFBEB"/>
    </linearGradient>
  </defs>

  <!-- Sky Layer -->
  <rect width="1600" height="900" fill="url(#farm-sky-3)"/>

  <!-- Distant Barn Silhouettes & Tree Clusters -->
  <g filter="url(#farm-shadow)" opacity="0.6">
    <rect x="1100" y="320" width="180" height="120" fill="#991B1B"/>
    <polygon points="1080,320 1190,240 1300,320" fill="#7F1D1D"/>
    <circle cx="1380" cy="350" r="40" fill="#15803D"/>
  </g>

  <!-- Tall Paper Windmill Cutout (Centerpiece Left) -->
  <g filter="url(#farm-shadow)">
    <!-- Windmill Tower -->
    <polygon points="260,580 340,580 320,320 280,320" fill="#F8FAFC" stroke="#94A3B8" stroke-width="2"/>
    <polygon points="270,320 300,280 330,320" fill="#78350F"/>
    
    <!-- Windmill Rotor Blades -->
    <circle cx="300" cy="320" r="8" fill="#451A03"/>
    <line x1="300" y1="320" x2="300" y2="160" stroke="#78350F" stroke-width="4"/>
    <line x1="300" y1="320" x2="300" y2="480" stroke="#78350F" stroke-width="4"/>
    <line x1="300" y1="320" x2="140" y2="320" stroke="#78350F" stroke-width="4"/>
    <line x1="300" y1="320" x2="460" y2="320" stroke="#78350F" stroke-width="4"/>
    <!-- Blade Lattice Sails -->
    <rect x="304" y="170" width="22" height="120" fill="#FEF08A" opacity="0.85"/>
    <rect x="304" y="340" width="22" height="120" fill="#FEF08A" opacity="0.85"/>
    <rect x="160" y="304" width="120" height="22" fill="#FEF08A" opacity="0.85"/>
    <rect x="320" y="304" width="120" height="22" fill="#FEF08A" opacity="0.85"/>
  </g>

  <!-- Rolling Green Pasture & Grazing Tiers -->
  <g filter="url(#farm-shadow)">
    <path d="M 0 540 Q 420 480 880 520 T 1600 490 L 1600 780 L 0 780 Z" fill="#4D7C0F"/>
    <!-- Lower Meadow Grazing Terrace -->
    <path d="M 0 680 Q 480 620 980 660 T 1600 640 L 1600 900 L 0 900 Z" fill="#3F6212"/>
  </g>

  <!-- Wooden Paddock Fence Rail -->
  <g filter="url(#farm-shadow)">
    <line x1="600" y1="720" x2="1600" y2="720" stroke="#92400E" stroke-width="4"/>
    <line x1="600" y1="745" x2="1600" y2="745" stroke="#92400E" stroke-width="4"/>
    <line x1="750" y1="700" x2="750" y2="770" stroke="#78350F" stroke-width="6"/>
    <line x1="1050" y1="700" x2="1050" y2="770" stroke="#78350F" stroke-width="6"/>
    <line x1="1350" y1="700" x2="1350" y2="770" stroke="#78350F" stroke-width="6"/>
  </g>
</svg>
