<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 80" width="100%" height="100%">
  <defs>
    <filter id="rock-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#0a140f" flood-opacity="0.25"/>
    </filter>
  </defs>

  <g filter="url(#rock-shadow)">
    <!-- Base Boulder Piece -->
    <path d="M 12 65 Q 18 35 42 22 Q 72 15 95 32 Q 104 50 96 68 Q 55 75 12 65 Z" fill="#64748B" stroke="#FFFFFF" stroke-width="1.5" stroke-linejoin="round"/>

    <!-- Angular Facets (Cut paper shading) -->
    <path d="M 42 22 L 58 45 L 95 32 Z" fill="#94A3B8" opacity="0.6"/>
    <path d="M 18 35 L 58 45 L 32 66 Z" fill="#475569" opacity="0.5"/>

    <!-- Small Moss Patch On Rock -->
    <path d="M 38 24 Q 48 18 60 22 Q 54 30 42 28 Z" fill="#4D7C0F" opacity="0.9"/>
  </g>
</svg>
