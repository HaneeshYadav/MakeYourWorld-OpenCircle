<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 160" width="100%" height="100%">
  <defs>
    <!-- Paper Edge Stroke & Drop Shadow -->
    <filter id="cutout-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#0a140f" flood-opacity="0.25"/>
    </filter>
  </defs>

  <g filter="url(#cutout-shadow)">
    <!-- Tree Trunk (Layered Paper Bark) -->
    <path d="M 52 100 L 48 155 Q 60 158 72 155 L 68 100 Z" fill="#5C3D2E" stroke="#42291E" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M 54 110 L 52 145 L 60 148 L 58 110 Z" fill="#6E4A38" opacity="0.6"/>

    <!-- Bottom Foliage Tier -->
    <path d="M 60 40 L 15 110 Q 60 102 105 110 Z" fill="#244B36" stroke="#FFFFFF" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M 60 40 L 25 110 Q 60 104 95 110 Z" fill="#2D5A42" opacity="0.7"/>

    <!-- Middle Foliage Tier -->
    <path d="M 60 22 L 25 78 Q 60 72 95 78 Z" fill="#2D5A42" stroke="#FFFFFF" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M 60 22 L 32 78 Q 60 74 88 78 Z" fill="#386E51" opacity="0.7"/>

    <!-- Top Foliage Tier -->
    <path d="M 60 8 L 35 48 Q 60 44 85 48 Z" fill="#3D7557" stroke="#FFFFFF" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M 60 8 L 42 48 Q 60 45 78 48 Z" fill="#4B8C6A" opacity="0.7"/>
  </g>
</svg>
