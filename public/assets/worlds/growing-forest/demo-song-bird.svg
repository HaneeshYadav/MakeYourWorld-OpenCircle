<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 80" width="100%" height="100%">
  <defs>
    <filter id="bird-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#0a140f" flood-opacity="0.22"/>
    </filter>
  </defs>

  <g filter="url(#bird-shadow)">
    <!-- Bird Tail -->
    <path d="M 22 45 L 5 40 L 8 50 L 25 48 Z" fill="#2563EB" stroke="#FFFFFF" stroke-width="1.5" stroke-linejoin="round"/>

    <!-- Bird Body -->
    <path d="M 22 42 Q 28 20 52 20 Q 75 20 80 38 Q 82 56 60 60 Q 35 62 22 42 Z" fill="#3B82F6" stroke="#FFFFFF" stroke-width="1.5" stroke-linejoin="round"/>

    <!-- Breast / Belly (Warm Accent Paper) -->
    <path d="M 45 35 Q 65 32 72 45 Q 70 58 52 58 Q 38 56 45 35 Z" fill="#F59E0B" opacity="0.9"/>

    <!-- Wing -->
    <path d="M 32 36 Q 50 30 58 46 Q 42 55 32 36 Z" fill="#1D4ED8" stroke="#FFFFFF" stroke-width="1.2" stroke-linejoin="round"/>

    <!-- Eye & Beak -->
    <polygon points="78,32 94,36 78,40" fill="#FBBF24" stroke="#D97706" stroke-width="1"/>
    <circle cx="68" cy="30" r="3.5" fill="#1E293B"/>
    <circle cx="69" cy="29" r="1" fill="#FFFFFF"/>
  </g>
</svg>
