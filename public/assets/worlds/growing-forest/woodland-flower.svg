<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 100" width="100%" height="100%">
  <defs>
    <filter id="flower-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#0a140f" flood-opacity="0.22"/>
    </filter>
  </defs>

  <g filter="url(#flower-shadow)">
    <!-- Stem and Leaf -->
    <path d="M 40 45 Q 42 75 38 98 L 42 98 Q 46 75 42 45 Z" fill="#2E7D32" stroke="#FFFFFF" stroke-width="1.2"/>
    <path d="M 41 68 Q 58 60 62 70 Q 52 78 41 72 Z" fill="#43A047" stroke="#FFFFFF" stroke-width="1"/>

    <!-- Bell Petals (Handmade Layered Bell) -->
    <path d="M 40 18 Q 20 25 24 45 Q 32 50 40 46 Q 48 50 56 45 Q 60 25 40 18 Z" fill="#7C3AED" stroke="#FFFFFF" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M 40 22 Q 28 28 30 42 Q 35 45 40 42 Q 45 45 50 42 Q 52 28 40 22 Z" fill="#A78BFA" opacity="0.8"/>
    <!-- Yellow Stamen Accent -->
    <circle cx="40" cy="46" r="3" fill="#FBBF24"/>
  </g>
</svg>
