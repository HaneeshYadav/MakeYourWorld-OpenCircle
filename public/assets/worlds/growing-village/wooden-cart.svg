<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 80" width="100%" height="100%">
  <defs>
    <filter id="cart-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#1c1917" flood-opacity="0.25"/>
    </filter>
  </defs>

  <g filter="url(#cart-shadow)">
    <!-- Wooden Spoke Wheel -->
    <circle cx="35" cy="55" r="18" fill="none" stroke="#78350F" stroke-width="3"/>
    <circle cx="35" cy="55" r="2" fill="#451A03"/>
    <line x1="35" y1="37" x2="35" y2="73" stroke="#78350F" stroke-width="1.5"/>
    <line x1="17" y1="55" x2="53" y2="55" stroke="#78350F" stroke-width="1.5"/>

    <!-- Wooden Cart Box -->
    <polygon points="20,45 85,45 95,25 15,25" fill="#B45309" stroke="#78350F" stroke-width="1.5"/>
    <line x1="38" y1="25" x2="42" y2="45" stroke="#78350F" stroke-width="1"/>
    <line x1="62" y1="25" x2="66" y2="45" stroke="#78350F" stroke-width="1"/>

    <!-- Cart Pull Shaft Handles -->
    <line x1="85" y1="35" x2="105" y2="48" stroke="#78350F" stroke-width="3.5" stroke-linecap="round"/>
  </g>
</svg>
