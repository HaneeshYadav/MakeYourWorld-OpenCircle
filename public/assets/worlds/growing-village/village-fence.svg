<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 60" width="100%" height="100%">
  <defs>
    <filter id="fence-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#1c1917" flood-opacity="0.25"/>
    </filter>
  </defs>

  <g filter="url(#fence-shadow)">
    <!-- Horizontal Cross Rails -->
    <rect x="5" y="20" width="90" height="6" rx="1" fill="#B45309" stroke="#78350F" stroke-width="1"/>
    <rect x="5" y="40" width="90" height="6" rx="1" fill="#B45309" stroke="#78350F" stroke-width="1"/>

    <!-- Vertical Picked Posts -->
    <!-- Post 1 -->
    <polygon points="15,8 23,8 27,15 27,55 11,55 11,15" fill="#D97706" stroke="#78350F" stroke-width="1.2"/>
    <!-- Post 2 -->
    <polygon points="45,8 53,8 57,15 57,55 41,55 41,15" fill="#D97706" stroke="#78350F" stroke-width="1.2"/>
    <!-- Post 3 -->
    <polygon points="75,8 83,8 87,15 87,55 71,55 71,15" fill="#D97706" stroke="#78350F" stroke-width="1.2"/>
  </g>
</svg>
