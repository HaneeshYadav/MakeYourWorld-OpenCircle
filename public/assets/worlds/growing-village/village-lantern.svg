<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 50 80" width="100%" height="100%">
  <defs>
    <filter id="lantern-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#1c1917" flood-opacity="0.25"/>
    </filter>
  </defs>

  <g filter="url(#lantern-shadow)">
    <!-- Top Ring Handle -->
    <circle cx="25" cy="10" r="6" fill="none" stroke="#451A03" stroke-width="2"/>
    <!-- Lantern Roof Cap -->
    <polygon points="12,22 38,22 25,12" fill="#78350F" stroke="#451A03" stroke-width="1.2"/>

    <!-- Glass Chamber with Candle Flame -->
    <rect x="15" y="22" width="20" height="35" fill="#FEF08A" stroke="#451A03" stroke-width="1.5"/>
    <!-- Candle Flame -->
    <path d="M 25 35 Q 22 46 25 50 Q 28 46 25 35 Z" fill="#EA580C"/>

    <!-- Bottom Base -->
    <rect x="12" y="57" width="26" height="8" rx="2" fill="#78350F" stroke="#451A03" stroke-width="1.2"/>
  </g>
</svg>
