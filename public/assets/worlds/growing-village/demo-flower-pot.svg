<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 70" width="100%" height="100%">
  <defs>
    <filter id="pot-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#1c1917" flood-opacity="0.25"/>
    </filter>
  </defs>

  <g filter="url(#pot-shadow)">
    <!-- Terracotta Clay Pot -->
    <polygon points="12,35 48,35 42,65 18,65" fill="#EA580C" stroke="#9A3412" stroke-width="1.2"/>
    <rect x="10" y="30" width="40" height="7" rx="1.5" fill="#C2410C" stroke="#9A3412" stroke-width="1"/>

    <!-- Green Bush & Small Red Blossoms -->
    <circle cx="30" cy="22" r="14" fill="#16A34A" stroke="#FFFFFF" stroke-width="1.2"/>
    <circle cx="24" cy="18" r="3" fill="#DC2626"/>
    <circle cx="36" cy="20" r="3" fill="#DC2626"/>
    <circle cx="30" cy="26" r="3" fill="#DC2626"/>
  </g>
</svg>
