<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="4" stdDeviation="2" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <!-- Well roof structure -->
    <polygon points="50,14 18,34 82,34" fill="#78350F" stroke="#451A03" stroke-width="2"/>
    <!-- Support beams -->
    <rect x="26" y="34" width="6" height="34" fill="#B45309" stroke="#78350F" stroke-width="1.5"/>
    <rect x="68" y="34" width="6" height="34" fill="#B45309" stroke="#78350F" stroke-width="1.5"/>
    <!-- Pulley & bucket -->
    <line x1="50" y1="32" x2="50" y2="48" stroke="#D97706" stroke-width="2"/>
    <polygon points="46,48 54,48 56,58 44,58" fill="#92400E" stroke="#78350F" stroke-width="1.5"/>
    <!-- Stone base -->
    <path d="M22 64 C22 58 78 58 78 64 L82 92 C82 96 18 96 18 92 Z" fill="#94A3B8" stroke="#475569" stroke-width="2"/>
    <!-- Stone texture lines -->
    <line x1="28" y1="74" x2="72" y2="74" stroke="#64748B" stroke-width="1.5"/>
    <line x1="24" y1="84" x2="76" y2="84" stroke="#64748B" stroke-width="1.5"/>
    <line x1="48" y1="64" x2="48" y2="74" stroke="#64748B" stroke-width="1.5"/>
    <line x1="36" y1="74" x2="36" y2="84" stroke="#64748B" stroke-width="1.5"/>
    <line x1="60" y1="74" x2="60" y2="84" stroke="#64748B" stroke-width="1.5"/>
  </g>
</svg>
