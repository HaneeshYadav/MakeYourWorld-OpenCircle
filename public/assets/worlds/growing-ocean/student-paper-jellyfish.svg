<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 110" width="100%" height="100%">
  <defs>
    <filter id="jelly-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#021c24" flood-opacity="0.25"/>
    </filter>
  </defs>

  <g filter="url(#jelly-shadow)">
    <!-- Wavy Tentacles -->
    <path d="M 30 50 Q 25 75 35 105" fill="none" stroke="#A78BFA" stroke-width="2"/>
    <path d="M 40 52 Q 45 78 38 108" fill="none" stroke="#C084FC" stroke-width="2.5"/>
    <path d="M 50 50 Q 55 75 45 105" fill="none" stroke="#A78BFA" stroke-width="2"/>
    <path d="M 22 48 Q 15 70 25 95" fill="none" stroke="#E879F9" stroke-width="1.5"/>
    <path d="M 58 48 Q 65 70 55 95" fill="none" stroke="#E879F9" stroke-width="1.5"/>

    <!-- Bell Dome (Translucent Violet Cardstock) -->
    <path d="M 15 45 Q 12 15 40 15 Q 68 15 65 45 Q 52 52 40 48 Q 28 52 15 45 Z" fill="#8B5CF6" stroke="#FFFFFF" stroke-width="1.5" opacity="0.9"/>
    
    <!-- Inner Glow Dome -->
    <path d="M 22 40 Q 20 22 40 22 Q 60 22 58 40 Q 50 44 40 42 Q 30 44 22 40 Z" fill="#C4B5FD" opacity="0.75"/>
  </g>
</svg>
