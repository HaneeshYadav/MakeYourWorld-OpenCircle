<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="100%" height="100%">
  <defs>
    <filter id="ocean-shadow" x="-10%" y="-10%" width="130%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#021c24" flood-opacity="0.3"/>
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#021c24" flood-opacity="0.2"/>
    </filter>
    <linearGradient id="kelp-water" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="50%" stop-color="#0369A1"/>
      <stop offset="100%" stop-color="#075985"/>
    </linearGradient>
  </defs>

  <!-- Deep Cyan Water Gradient -->
  <rect width="1600" height="900" fill="url(#kelp-water)"/>

  <!-- Faint Water Caustics / Depth Rays -->
  <g opacity="0.15">
    <polygon points="300,0 360,0 550,650 460,650" fill="#BAE6FD"/>
    <polygon points="800,0 870,0 1120,700 1020,700" fill="#BAE6FD"/>
    <polygon points="1200,0 1260,0 1480,620 1400,620" fill="#BAE6FD"/>
  </g>

  <!-- Distant Kelp Fronds Silhouettes -->
  <g opacity="0.4">
    <path d="M 220 900 Q 180 650 250 420 T 200 180" fill="none" stroke="#064E3B" stroke-width="24" stroke-linecap="round"/>
    <path d="M 720 900 Q 760 620 700 380 T 740 120" fill="none" stroke="#064E3B" stroke-width="28" stroke-linecap="round"/>
    <path d="M 1380 900 Q 1320 640 1400 390 T 1360 150" fill="none" stroke="#064E3B" stroke-width="26" stroke-linecap="round"/>
  </g>

  <!-- Midground Kelp Canopy Strands -->
  <g opacity="0.65" filter="url(#ocean-shadow)">
    <path d="M 440 900 Q 500 680 430 460 T 480 220" fill="none" stroke="#047857" stroke-width="32" stroke-linecap="round"/>
    <path d="M 1080 900 Q 1020 660 1100 440 T 1050 200" fill="none" stroke="#047857" stroke-width="34" stroke-linecap="round"/>
  </g>

  <!-- Deep Ocean Rocky Ridge & Shelf -->
  <g filter="url(#ocean-shadow)">
    <path d="M 0 720 Q 450 670 950 710 T 1600 680 L 1600 900 L 0 900 Z" fill="#042F2E"/>
    <path d="M 0 810 Q 500 760 1050 800 T 1600 770 L 1600 900 L 0 900 Z" fill="#021E1E"/>
  </g>
</svg>
