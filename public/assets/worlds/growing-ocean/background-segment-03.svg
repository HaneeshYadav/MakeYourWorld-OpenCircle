<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="100%" height="100%">
  <defs>
    <filter id="ocean-shadow" x="-10%" y="-10%" width="130%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#010e14" flood-opacity="0.4"/>
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#010e14" flood-opacity="0.25"/>
    </filter>
    <linearGradient id="twilight-water" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#075985"/>
      <stop offset="50%" stop-color="#0C4A6E"/>
      <stop offset="100%" stop-color="#082F49"/>
    </linearGradient>
  </defs>

  <!-- Twilight Ocean Water Gradient -->
  <rect width="1600" height="900" fill="url(#twilight-water)"/>

  <!-- Faint Floating Bioluminescent Spores -->
  <g opacity="0.6">
    <circle cx="240" cy="220" r="3" fill="#2DD4BF" filter="url(#ocean-shadow)"/>
    <circle cx="480" cy="380" r="2.5" fill="#38BDF8"/>
    <circle cx="780" cy="290" r="3.5" fill="#2DD4BF"/>
    <circle cx="1120" cy="350" r="2.5" fill="#38BDF8"/>
    <circle cx="1380" cy="240" r="3" fill="#2DD4BF"/>
  </g>

  <!-- Distant Sunken Oceanic Ridge Silhouette -->
  <g filter="url(#ocean-shadow)">
    <path d="M 0 580 Q 350 510 750 560 T 1600 520 L 1600 900 L 0 900 Z" fill="#062E3B" opacity="0.75"/>
  </g>

  <!-- Deep Shelf Arch & Sea Floor Tiers -->
  <g filter="url(#ocean-shadow)">
    <path d="M 0 680 Q 480 620 980 670 T 1600 640 L 1600 900 L 0 900 Z" fill="#04202A"/>
    <!-- Deep Shelf Tier -->
    <path d="M 0 780 Q 420 730 880 770 T 1600 750 L 1600 900 L 0 900 Z" fill="#02141C"/>
  </g>
</svg>
