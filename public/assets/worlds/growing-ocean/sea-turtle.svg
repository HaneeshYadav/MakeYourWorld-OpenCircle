<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 80" width="100%" height="100%">
  <defs>
    <filter id="turtle-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#021c24" flood-opacity="0.25"/>
    </filter>
  </defs>

  <g filter="url(#turtle-shadow)">
    <!-- Flippers (Front and Back) -->
    <path d="M 68 35 Q 92 18 102 32 Q 95 48 72 45 Z" fill="#047857" stroke="#FFFFFF" stroke-width="1.2"/>
    <path d="M 68 55 Q 88 68 96 60 Q 92 48 72 48 Z" fill="#065F46"/>
    <path d="M 30 35 Q 15 25 10 32 Q 15 42 28 42 Z" fill="#047857"/>
    <path d="M 30 55 Q 15 62 12 56 Q 16 48 28 48 Z" fill="#065F46"/>

    <!-- Head & Neck -->
    <path d="M 72 40 Q 88 38 92 45 Q 88 52 72 50 Z" fill="#10B981" stroke="#FFFFFF" stroke-width="1.2"/>
    <circle cx="86" cy="43" r="1.5" fill="#064E3B"/>

    <!-- Carapace Shell (Paper Scutes) -->
    <ellipse cx="50" cy="46" rx="28" ry="20" fill="#059669" stroke="#FFFFFF" stroke-width="1.5"/>
    <!-- Scute Patterns -->
    <polygon points="50,34 60,42 56,52 44,52 40,42" fill="#34D399"/>
    <polygon points="60,42 72,44 68,52 56,52" fill="#10B981"/>
    <polygon points="40,42 44,52 32,52 28,44" fill="#10B981"/>
  </g>
</svg>
