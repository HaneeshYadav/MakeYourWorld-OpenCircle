<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 70" width="100%" height="100%">
  <defs>
    <filter id="fish-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#021c24" flood-opacity="0.22"/>
    </filter>
  </defs>

  <g filter="url(#fish-shadow)">
    <!-- Tail Fin -->
    <path d="M 28 35 L 8 20 Q 15 35 8 50 Z" fill="#F97316" stroke="#FFFFFF" stroke-width="1.2"/>
    
    <!-- Body (Warm Orange Paper) -->
    <path d="M 28 35 Q 40 18 68 22 Q 88 28 92 35 Q 88 42 68 48 Q 40 52 28 35 Z" fill="#EA580C" stroke="#FFFFFF" stroke-width="1.5"/>
    
    <!-- White Paper Stripes -->
    <path d="M 68 22 Q 72 35 68 48 L 62 47 Q 66 35 62 23 Z" fill="#FFFFFF"/>
    <path d="M 46 22 Q 50 35 46 48 L 40 47 Q 44 35 40 23 Z" fill="#FFFFFF"/>

    <!-- Eye -->
    <circle cx="82" cy="30" r="3" fill="#1E293B"/>
    <circle cx="83" cy="29" r="1" fill="#FFFFFF"/>
  </g>
</svg>
