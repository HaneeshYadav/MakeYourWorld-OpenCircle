<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="100%" height="100%">
  <defs>
    <filter id="shell-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#021c24" flood-opacity="0.25"/>
    </filter>
  </defs>

  <g filter="url(#shell-shadow)">
    <!-- Scallop Shell Base -->
    <path d="M 40 70 Q 20 68 15 50 Q 10 25 35 15 Q 40 14 45 15 Q 70 25 65 50 Q 60 68 40 70 Z" fill="#FDE68A" stroke="#FFFFFF" stroke-width="1.5" stroke-linejoin="round"/>
    
    <!-- Fan Ribs / Ridges -->
    <path d="M 40 70 L 40 14" stroke="#F59E0B" stroke-width="1.5"/>
    <path d="M 40 70 L 25 20" stroke="#F59E0B" stroke-width="1.2"/>
    <path d="M 40 70 L 55 20" stroke="#F59E0B" stroke-width="1.2"/>
    <path d="M 40 70 L 15 35" stroke="#F59E0B" stroke-width="1"/>
    <path d="M 40 70 L 65 35" stroke="#F59E0B" stroke-width="1"/>

    <!-- Pearl Accent Inside -->
    <circle cx="40" cy="55" r="5" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  </g>
</svg>
