<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="4" stdDeviation="2" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <!-- Telescope base/tripod -->
    <line x1="50" y1="62" x2="30" y2="92" stroke="#1E293B" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="50" y1="62" x2="70" y2="92" stroke="#1E293B" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="50" y1="62" x2="50" y2="92" stroke="#334155" stroke-width="3" stroke-linecap="round"/>
    <circle cx="50" cy="62" r="5" fill="#EAB308" stroke="#CA8A04" stroke-width="1.5"/>
    <!-- Optical Tube Assembly -->
    <g transform="rotate(-30 50 55)">
      <rect x="22" y="50" width="56" height="12" rx="3" fill="#1E3A8A" stroke="#172554" stroke-width="2"/>
      <rect x="74" y="48" width="8" height="16" rx="2" fill="#EAB308" stroke="#CA8A04" stroke-width="1.5"/>
      <rect x="16" y="52" width="8" height="8" rx="2" fill="#475569" stroke="#1E293B" stroke-width="1.5"/>
    </g>
  </g>
</svg>
