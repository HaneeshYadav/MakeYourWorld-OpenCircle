<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 80" width="100%" height="100%">
  <defs>
    <filter id="bike-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#1e1b4b" flood-opacity="0.25"/>
    </filter>
  </defs>

  <g filter="url(#bike-shadow)">
    <!-- Wheels -->
    <circle cx="28" cy="52" r="22" fill="none" stroke="#1E1B4B" stroke-width="3"/>
    <circle cx="28" cy="52" r="2" fill="#94A3B8"/>
    <circle cx="82" cy="52" r="22" fill="none" stroke="#1E1B4B" stroke-width="3"/>
    <circle cx="82" cy="52" r="2" fill="#94A3B8"/>

    <!-- Frame (Burgundy Red Cardstock) -->
    <path d="M 28 52 L 50 52 L 72 32 L 44 32 Z" fill="none" stroke="#991B1B" stroke-width="3.5" stroke-linejoin="round"/>
    <line x1="50" y1="52" x2="44" y2="24" stroke="#991B1B" stroke-width="3.5"/>
    <line x1="82" y1="52" x2="72" y2="22" stroke="#991B1B" stroke-width="3.5"/>

    <!-- Saddle & Front Wire Basket -->
    <path d="M 38 24 L 50 24" stroke="#451A03" stroke-width="4" stroke-linecap="round"/>
    <rect x="74" y="24" width="14" height="12" rx="2" fill="#FEF08A" stroke="#CA8A04" stroke-width="1.2"/>
  </g>
</svg>
