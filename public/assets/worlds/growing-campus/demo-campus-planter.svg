<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 70 80" width="100%" height="100%">
  <defs>
    <filter id="planter-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#1e1b4b" flood-opacity="0.25"/>
    </filter>
  </defs>

  <g filter="url(#planter-shadow)">
    <!-- Terracotta Concrete Square Urn -->
    <polygon points="12,42 58,42 50,75 20,75" fill="#CBD5E1" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="8" y="36" width="54" height="8" rx="2" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1"/>

    <!-- Lush Topiary Foliage & Gold Marigolds -->
    <circle cx="35" cy="24" r="16" fill="#15803D" stroke="#FFFFFF" stroke-width="1.2"/>
    <circle cx="28" cy="20" r="3.5" fill="#FBBF24"/>
    <circle cx="42" cy="22" r="3.5" fill="#FBBF24"/>
    <circle cx="35" cy="28" r="3" fill="#F59E0B"/>
  </g>
</svg>
