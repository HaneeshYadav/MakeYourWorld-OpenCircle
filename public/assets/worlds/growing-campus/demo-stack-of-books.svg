<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 70 80" width="100%" height="100%">
  <defs>
    <filter id="books-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#1e1b4b" flood-opacity="0.25"/>
    </filter>
  </defs>

  <g filter="url(#books-shadow)">
    <!-- Bottom Book (Navy Blue) -->
    <rect x="10" y="54" width="50" height="14" rx="2" fill="#1E3A8A" stroke="#172554" stroke-width="1.2"/>
    <rect x="14" y="57" width="42" height="8" fill="#FFFDF7"/>
    <!-- Middle Book (Crimson Red) -->
    <rect x="14" y="38" width="46" height="14" rx="2" fill="#991B1B" stroke="#7F1D1D" stroke-width="1.2"/>
    <rect x="18" y="41" width="38" height="8" fill="#FFFDF7"/>
    <!-- Top Book (Gold) -->
    <rect x="18" y="22" width="40" height="14" rx="2" fill="#D97706" stroke="#B45309" stroke-width="1.2"/>
    <rect x="22" y="25" width="32" height="8" fill="#FFFDF7"/>

    <!-- Red Ribbon Bookmark Hanging Out -->
    <path d="M 45 36 L 45 68 L 48 64 L 51 68 L 51 36 Z" fill="#DC2626"/>
  </g>
</svg>
