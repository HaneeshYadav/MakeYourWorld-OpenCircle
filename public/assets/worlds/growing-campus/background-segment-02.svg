<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="100%" height="100%">
  <defs>
    <filter id="campus-shadow" x="-10%" y="-10%" width="130%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#1e1b4b" flood-opacity="0.22"/>
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#1e1b4b" flood-opacity="0.12"/>
    </filter>
    <linearGradient id="campus-sky-2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#93C5FD"/>
      <stop offset="60%" stop-color="#E0E7FF"/>
      <stop offset="100%" stop-color="#FEF08A"/>
    </linearGradient>
  </defs>

  <!-- Sky Layer (Continuous with Segment 01) -->
  <rect width="1600" height="900" fill="url(#campus-sky-2)"/>

  <!-- Background Academic Lecture Halls (Collegiate Gothic Ivy Brick) -->
  <g filter="url(#campus-shadow)">
    <!-- Left Hall -->
    <rect x="80" y="260" width="380" height="380" fill="#991B1B" stroke="#7F1D1D" stroke-width="2"/>
    <polygon points="50,260 270,140 490,260" fill="#4C0519"/>
    <!-- Windows Grid -->
    <rect x="130" y="320" width="40" height="60" rx="3" fill="#FEF08A"/>
    <rect x="220" y="320" width="40" height="60" rx="3" fill="#FEF08A"/>
    <rect x="310" y="320" width="40" height="60" rx="3" fill="#FEF08A"/>
    <rect x="130" y="420" width="40" height="60" rx="3" fill="#FEF08A"/>
    <rect x="220" y="420" width="40" height="60" rx="3" fill="#FEF08A"/>
    <rect x="310" y="420" width="40" height="60" rx="3" fill="#FEF08A"/>

    <!-- Right Hall -->
    <rect x="1140" y="260" width="380" height="380" fill="#991B1B" stroke="#7F1D1D" stroke-width="2"/>
    <polygon points="1110,260 1330,140 1550,260" fill="#4C0519"/>
    <rect x="1190" y="320" width="40" height="60" rx="3" fill="#FEF08A"/>
    <rect x="1280" y="320" width="40" height="60" rx="3" fill="#FEF08A"/>
    <rect x="1370" y="320" width="40" height="60" rx="3" fill="#FEF08A"/>
  </g>

  <!-- Central Academic Quad Lawn & Diagonal Footpaths -->
  <g filter="url(#campus-shadow)">
    <!-- Quad Green -->
    <rect x="0" y="620" width="1600" height="280" fill="#15803D"/>
    <!-- Diagonal Criss-Cross Paved Walkways -->
    <polygon points="0,680 1600,820 1600,880 0,740" fill="#CBD5E1" opacity="0.9"/>
    <polygon points="1600,680 0,820 0,880 1600,740" fill="#CBD5E1" opacity="0.9"/>
    <!-- Central Circular Sundial Plaza -->
    <circle cx="800" cy="780" r="90" fill="#E2E8F0" stroke="#94A3B8" stroke-width="2"/>
    <circle cx="800" cy="780" r="30" fill="#94A3B8"/>
  </g>
</svg>
