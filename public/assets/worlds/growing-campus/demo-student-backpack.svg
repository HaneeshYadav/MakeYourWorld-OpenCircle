<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 70 90" width="100%" height="100%">
  <defs>
    <filter id="pack-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#1e1b4b" flood-opacity="0.25"/>
    </filter>
  </defs>

  <g filter="url(#pack-shadow)">
    <!-- Backpack Main Body (Mustard Yellow Cardstock) -->
    <rect x="15" y="24" width="40" height="52" rx="10" fill="#EAB308" stroke="#CA8A04" stroke-width="1.5"/>
    
    <!-- Front Zipper Pocket -->
    <rect x="18" y="48" width="34" height="24" rx="6" fill="#FACC15" stroke="#CA8A04" stroke-width="1.2"/>
    <line x1="22" y1="54" x2="48" y2="54" stroke="#713F12" stroke-width="1.5"/>

    <!-- Top Grab Loop Handle -->
    <path d="M 28 24 Q 35 12 42 24" fill="none" stroke="#713F12" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
