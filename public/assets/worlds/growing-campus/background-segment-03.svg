<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="100%" height="100%">
  <defs>
    <filter id="campus-shadow" x="-10%" y="-10%" width="130%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#1e1b4b" flood-opacity="0.22"/>
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#1e1b4b" flood-opacity="0.12"/>
    </filter>
    <linearGradient id="campus-sky-3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7DD3FC"/>
      <stop offset="60%" stop-color="#E0E7FF"/>
      <stop offset="100%" stop-color="#FFFBEB"/>
    </linearGradient>
  </defs>

  <!-- Sky Layer -->
  <rect width="1600" height="900" fill="url(#campus-sky-3)"/>

  <!-- Grand University Library Facade (Classical Domed Stacks) -->
  <g filter="url(#campus-shadow)">
    <!-- Central Rotunda Dome -->
    <path d="M 620 300 Q 800 120 980 300 Z" fill="#1E3A8A" stroke="#172554" stroke-width="2"/>
    <rect x="785" y="80" width="30" height="45" fill="#FBBF24"/>
    <circle cx="800" cy="70" r="14" fill="#FBBF24"/>

    <!-- Library Main Classical Building -->
    <rect x="420" y="280" width="760" height="360" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2"/>
    <!-- Triangular Portico Pediment -->
    <polygon points="400,280 800,160 1200,280" fill="#E2E8F0" stroke="#94A3B8" stroke-width="2"/>
    <!-- Colonnade Columns -->
    <rect x="480" y="280" width="28" height="360" fill="#CBD5E1"/>
    <rect x="580" y="280" width="28" height="360" fill="#CBD5E1"/>
    <rect x="680" y="280" width="28" height="360" fill="#CBD5E1"/>
    <rect x="890" y="280" width="28" height="360" fill="#CBD5E1"/>
    <rect x="990" y="280" width="28" height="360" fill="#CBD5E1"/>
    <rect x="1090" y="280" width="28" height="360" fill="#CBD5E1"/>
  </g>

  <!-- Library Paved Plaza & Terraced Stone Steps -->
  <g filter="url(#campus-shadow)">
    <!-- Terraced Stairs -->
    <rect x="360" y="640" width="880" height="20" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1"/>
    <rect x="300" y="660" width="1000" height="20" fill="#CBD5E1" stroke="#94A3B8" stroke-width="1"/>
    <!-- Plaza Stone Floor -->
    <rect x="0" y="680" width="1600" height="220" fill="#E2E8F0"/>
    <ellipse cx="800" cy="800" rx="460" ry="80" fill="#CBD5E1" stroke="#94A3B8" stroke-width="1.5"/>
  </g>
</svg>
