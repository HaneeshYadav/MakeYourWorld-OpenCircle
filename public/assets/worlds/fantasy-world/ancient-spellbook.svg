<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 70" width="100%" height="100%">
  <defs>
    <filter id="book-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#2e1065" flood-opacity="0.25"/>
    </filter>
  </defs>

  <g filter="url(#book-shadow)">
    <!-- Leather Bound Grimoire Cover (Purple/Gold) -->
    <!-- Left Page Wing -->
    <path d="M 40 55 L 12 50 L 10 22 L 40 28 Z" fill="#581C87" stroke="#3B0764" stroke-width="1.5"/>
    <path d="M 38 52 L 14 47 L 13 24 L 38 30 Z" fill="#FEF3C7"/>
    
    <!-- Right Page Wing -->
    <path d="M 40 55 L 68 50 L 70 22 L 40 28 Z" fill="#581C87" stroke="#3B0764" stroke-width="1.5"/>
    <path d="M 42 52 L 66 47 L 67 24 L 42 30 Z" fill="#FEF3C7"/>

    <!-- Gold Binding Spine & Pentagram Crest -->
    <line x1="40" y1="26" x2="40" y2="58" stroke="#FBBF24" stroke-width="3"/>
    <circle cx="26" cy="36" r="4" fill="#F59E0B"/>
    <circle cx="54" cy="36" r="4" fill="#F59E0B"/>
  </g>
</svg>
