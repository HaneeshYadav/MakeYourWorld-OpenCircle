<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 70 80" width="100%" height="100%">
  <defs>
    <filter id="rune-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#2e1065" flood-opacity="0.25"/>
    </filter>
  </defs>

  <g filter="url(#rune-shadow)">
    <!-- Standing Monolith Stone Slab -->
    <polygon points="20,15 50,12 55,70 15,70" fill="#475569" stroke="#334155" stroke-width="1.5"/>
    <!-- Shading facet -->
    <polygon points="50,12 55,70 42,70 38,13" fill="#334155"/>

    <!-- Glowing Arcane Rune Glyph (Golden Amber) -->
    <path d="M 28 28 L 36 45 L 24 56 M 36 28 L 28 45 L 40 56 M 22 40 L 42 40" stroke="#FBBF24" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  </g>
</svg>
