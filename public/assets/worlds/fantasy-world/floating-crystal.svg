<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 70 90" width="100%" height="100%">
  <defs>
    <filter id="crystal-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#2e1065" flood-opacity="0.25"/>
    </filter>
  </defs>

  <g filter="url(#crystal-shadow)">
    <!-- Floating Arcane Gem Diamond (Cyan/Violet Facets) -->
    <!-- Top Apex -->
    <polygon points="35,15 55,42 15,42" fill="#67E8F9" stroke="#FFFFFF" stroke-width="1.2"/>
    <polygon points="35,15 55,42 35,42" fill="#22D3EE"/>
    
    <!-- Bottom Inverted Pyramid -->
    <polygon points="15,42 55,42 35,75" fill="#06B6D4" stroke="#FFFFFF" stroke-width="1.2"/>
    <polygon points="35,42 55,42 35,75" fill="#0891B2"/>

    <!-- Subtle Sparkle Stars -->
    <circle cx="20" cy="22" r="2" fill="#FDE047"/>
    <circle cx="52" cy="62" r="2" fill="#FDE047"/>
  </g>
</svg>
