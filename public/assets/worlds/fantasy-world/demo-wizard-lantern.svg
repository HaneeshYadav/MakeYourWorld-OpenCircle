<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 90" width="100%" height="100%">
  <defs>
    <filter id="wiz-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#2e1065" flood-opacity="0.25"/>
    </filter>
  </defs>

  <g filter="url(#wiz-shadow)">
    <!-- Twisted Brass Staff Handle & Hook -->
    <path d="M 30 85 L 30 25 Q 30 10 42 16" fill="none" stroke="#78350F" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Hanging Lantern Cage -->
    <rect x="34" y="24" width="16" height="24" rx="2" fill="#FEF08A" stroke="#451A03" stroke-width="1.2"/>
    <polygon points="32,24 52,24 42,16" fill="#78350F"/>
    
    <!-- Blue Mystic Fire Core -->
    <circle cx="42" cy="36" r="4" fill="#38BDF8"/>
  </g>
</svg>
