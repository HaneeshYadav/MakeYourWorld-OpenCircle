name: Notify Discord on Good First Issue

on:
  issues:
    types: [labeled]

jobs:
  notify-discord:
    if: github.event.label.name == 'good first issue'
    runs-on: ubuntu-latest
    steps:
      - name: Send Notification to Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          REPOSITORY: ${{ github.repository }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
        run: |
          payload=$(jq -n \
            --arg title "🟢 Good First Issue: $ISSUE_TITLE" \
            --arg url "$ISSUE_URL" \
            --arg description "$ISSUE_BODY" \
            --arg repository "$REPOSITORY" \
            --arg author "$ISSUE_AUTHOR" \
            '{embeds: [{title: $title, url: $url, description: $description, color: 5763719, fields: [{name: "Repository", value: $repository, inline: true}, {name: "Opened By", value: $author, inline: true}], footer: {text: "Open Circle Onboarding • Claim this issue on GitHub!"}}]}')

          curl --fail-with-body --silent --show-error \
            --max-time 30 \
            -H "Content-Type: application/json" \
            -X POST \
            -d "$payload" \
            "$DISCORD_WEBHOOK"
