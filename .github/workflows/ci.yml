name: CI & Contributor Validation

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  validate:
    name: Contributor Quality Gates & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (with full history for diffing)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies (clean lockfile install)
        run: npm ci

      # Evaluates whether the PR is a Student Contribution (modifying assets/data) or a Maintainer PR.
      # If student contribution, strictly validates 2 commits and contributor file boundaries.
      # If maintainer PR (docs, engine, scripts, ci, etc.), safely skips the 2-commit check.
      - name: Verify Contributor Boundaries & Commits
        if: github.event_name == 'pull_request'
        run: npx tsx scripts/validate-pr.ts

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript Typecheck
        run: npm run typecheck

      - name: Audit Data & Asset Integrity
        run: npx tsx scripts/audit-integrity.ts

      - name: Run Vitest Unit & Schema Tests
        run: npm test

      - name: Run Next.js Production SSG Build
        run: npm run build
