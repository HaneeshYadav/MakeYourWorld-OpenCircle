  - type: markdown
    attributes:
      value: |
        ---

        # 🟢 Good First Issue Instructions (Contributor Reference)

        > 🌱 **Welcome!** This is a beginner-friendly micro-contribution. No previous open-source experience is required! Follow the steps below carefully and you will complete your contribution from start to finish.

        ---

        ## 🎯 Your Task
        Your task is to add **ONE** paper-cutout object to the selected **World** inside the assigned **Segment**.
        - Your contribution will permanently live in the shared diorama, credited with your name in a paper badge!
        - You must strictly stay within your assigned world and segment — do not modify unrelated worlds.

        ---

        ## 📁 Files You Will Change

        ```text
        Commit 1 (Asset & Object Registration):
        ├── public/assets/worlds/<world-name>/<object-name>.svg  (Your paper artwork)
        └── src/data/worlds/<world-name>/objects.ts              (Object metadata & your attribution)

        Commit 2 (World Placement):
        └── src/data/worlds/<world-name>/placements.ts           (Coordinates & segment placement)
        ```

        ---

        # 🔐 IMPORTANT — EXACTLY 2 COMMITS REQUIRED

        The automated PR validator requires **exactly two separate commits**:
        - **Commit 1**: MUST contain your SVG asset and registration in `objects.ts`. MUST NOT contain `placements.ts`.
        - **Commit 2**: MUST contain ONLY your placement in `placements.ts`.
        - ⚠️ **Do NOT squash** your commits! Keep them separate so automated CI checks can verify both steps.

        ---

        # 🛠️ Step-by-Step Walkthrough

        ### Step 1: Fork & Clone
        1. Fork this repository to your GitHub account.
        2. Clone your fork locally:
        ```bash
        git clone https://github.com/<your-username>/OpenCircle-Test.git
        cd OpenCircle-Test
        ```
        3. Add the upstream repository:
        ```bash
        git remote add upstream https://github.com/ShenSandaru/OpenCircle-Test.git
        ```

        ### Step 2: Update `dev` and Branch
        Always start your work from the latest upstream `dev` branch:
        ```bash
        git checkout dev
        git fetch upstream
        git pull upstream dev
        ```
        Create your contribution branch using the required `contrib/` prefix:
        ```bash
        git checkout -b contrib/<world-name>-<object-name>
        ```
        *Example:* `git checkout -b contrib/growing-forest-butterfly`

        ### Step 3: Install Dependencies
        ```bash
        npm install
        ```

        ### Step 4: Create Commit 1 (Asset & Object Registration)
        1. Create your 2D paper-cutout SVG asset (transparent background, <50KB) and save it to:
           `public/assets/worlds/<world-name>/<object-name>.svg`
        2. Register the object in `src/data/worlds/<world-name>/objects.ts`:
        ```typescript
        {
          id: "<object-name>",
          asset: "/assets/worlds/<world-name>/<object-name>.svg",
          contributor: {
            displayName: "Your Name",
            githubUsername: "your-github-username",
          },
        },
        ```
        3. Verify with `git status` and `git diff`, then commit:
        ```bash
        git add public/assets/worlds/<world-name>/<object-name>.svg
        git add src/data/worlds/<world-name>/objects.ts
        git commit -m "feat: add <object-name> asset and object"
        ```

        ### Step 5: Create Commit 2 (Placement Only)
        1. Open `src/data/worlds/<world-name>/placements.ts` and append your placement:
        ```typescript
        {
          objectId: "<object-name>",
          segmentId: "<assigned-segment-id>",
          x: 45.0,
          y: 55.0,
          scale: 1.0,
          rotation: 0,
        },
        ```
        *(Coordinates `x` and `y` are normalized percentages `0.0` to `100.0`)*
        2. Verify with `git status` and `git diff`, then commit:
        ```bash
        git add src/data/worlds/<world-name>/placements.ts
        git commit -m "feat: place <object-name> in <assigned-segment-id>"
        ```

        ### Step 6: Verify Commit History
        Check that you have exactly 2 separate commits:
        ```bash
        git log --oneline -2
        ```
        Expected output:
        ```text
        <hash-2> feat: place <object-name> in <assigned-segment-id>
        <hash-1> feat: add <object-name> asset and object
        ```

        ### Step 7: Run Local Quality Checks & Test
        ```bash
        npm run lint
        npm run typecheck
        npm test
        npm run build
        ```

        ### Step 8: Visual Verification
        Start the dev server:
        ```bash
        npm run dev
        ```
        Open `http://localhost:3000/worlds/<world-name>` in your browser to see your paper craft and contributor badge in action!

        ### Step 9: Push & Open Pull Request
        1. Push to your fork:
        ```bash
        git push -u origin contrib/<world-name>-<object-name>
        ```
        2. Open a Pull Request on GitHub:
           - **Base branch**: `dev` *(Do NOT target `main`)*
           - **Compare branch**: `contrib/<world-name>-<object-name>`
        3. In the PR description, link this issue:
        ```markdown
        ## 🔗 Linked Issue
        Closes #<THIS_ISSUE_NUMBER>
        ```

        ---

        # 🚫 Do NOT Modify
        Do **NOT** edit `.github/`, `docs/`, `scripts/`, `tests/`, `src/engine/`, `src/schemas/`, `src/components/`, `src/app/`, or `package.json`.
